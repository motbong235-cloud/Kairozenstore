<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product · {{ site.name }}</title>
<meta name="theme-color" content="#1d4ed8">
<link rel="icon" href="{{ site.logo }}">
<style>
:root{
  --blue:#1d4ed8;--blue2:#2563eb;--blue-soft:#eff6ff;--blue-line:#dbeafe;
  --bg:#f3f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--faint:#94a3b8;
  --red:#ef4444;--green:#16a34a;--green-bg:#dcfce7;
  --line:#e2e8f0;--shadow:0 4px 20px rgba(15,23,42,.06);
  --font:'Inter','Kantumruy Pro',system-ui,sans-serif;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased}
button,a{font:inherit}button{cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--blue2);text-decoration:none}
.hidden{display:none!important}

.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}
.back{width:40px;height:40px;border-radius:12px;background:#f1f5f9;display:grid;place-items:center;color:var(--text)}
.back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.top .title{font-weight:800;font-size:15px;color:var(--blue);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:12px;background:#f1f5f9;display:grid;place-items:center;color:var(--blue)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}

.hero-img{
  background:linear-gradient(180deg,#fff,#f8fafc);margin:0;position:relative;
  aspect-ratio:1;max-height:400px;display:grid;place-items:center;overflow:hidden;
}
.hero-img img{width:100%;height:100%;object-fit:contain;padding:8%;display:block;
  background:linear-gradient(160deg,#ffffff 0%,#f1f5f9 50%,#eef2ff 100%)}
.hero-img img.logo{object-fit:contain;padding:6%;background:linear-gradient(160deg,#ffffff 0%,#f8fafc 100%)}
.hero-img .ph{font-size:48px;font-weight:800;color:rgba(37,99,235,.2)}
.badge-hot{position:absolute;top:14px;left:14px;background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;
  font-size:11px;font-weight:800;padding:5px 10px;border-radius:8px}
.badge-off{position:absolute;top:14px;right:14px;background:var(--blue);color:#fff;
  font-size:11px;font-weight:800;padding:5px 10px;border-radius:99px}

.sheet{background:var(--card);margin:0;padding:20px 16px 130px;border-radius:20px 20px 0 0;margin-top:-16px;position:relative;z-index:1;box-shadow:0 -8px 24px rgba(15,23,42,.04)}
.cat{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
h1{font-size:22px;font-weight:800;color:var(--text);line-height:1.25;margin-bottom:8px}
.rating{display:flex;align-items:center;gap:6px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.rating .stars{color:#f59e0b;letter-spacing:1px;font-weight:700}
.prices{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.now{font-size:28px;font-weight:800;color:var(--red);letter-spacing:-.02em}
.was{font-size:16px;color:var(--faint);text-decoration:line-through}
.offchip{font-size:12px;font-weight:800;background:#fee2e2;color:var(--red);padding:4px 10px;border-radius:99px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.meta span{font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;background:#f1f5f9;color:var(--muted)}
.meta span.ok{background:var(--green-bg);color:var(--green)}
.meta span.bad{background:#fee2e2;color:var(--red)}
.meta span.blue{background:var(--blue-soft);color:var(--blue)}

.block{margin:16px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:#f8fafc}
.block h3{font-size:14px;font-weight:800;margin-bottom:8px;color:var(--blue)}
.block p,.block .desc{font-size:13px;color:var(--muted);line-height:1.65;white-space:pre-wrap}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}

.rel h3{font-size:16px;font-weight:800;color:var(--blue);margin:20px 0 10px;padding:0 2px}
.rel-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.rel-card{flex:0 0 130px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.rel-card .ri{aspect-ratio:1;background:#f1f5f9;display:grid;place-items:center}
.rel-card .ri img{width:100%;height:100%;object-fit:contain;padding:12%;background:#fff}
.rel-card .ri img.logo{object-fit:contain;padding:10%;background:#fff}
.rel-card .rb{padding:8px}
.rel-card .rn{font-size:12px;font-weight:700;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.rel-card .rp{font-size:13px;font-weight:800;color:var(--red);margin-top:4px}

.sticky-buy{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:12px 14px calc(12px + var(--safe));
  display:flex;gap:10px;align-items:center;
  box-shadow:0 -8px 30px rgba(15,23,42,.08);
}
.sticky-buy .sp{flex:1;min-width:0}
.sticky-buy .sp .l{font-size:11px;color:var(--muted);font-weight:600}
.sticky-buy .sp .v{font-size:18px;font-weight:800;color:var(--red)}
.btn-buy{
  flex:1.2;padding:14px 18px;border-radius:14px;background:var(--blue);color:#fff;
  font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 6px 20px rgba(29,78,216,.3);transition:transform .12s,box-shadow .12s;
}
.btn-buy:active{transform:scale(.98)}
.btn-buy:disabled{opacity:.45;background:#94a3b8}
.btn-buy svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}

/* modal pay — minimal reuse */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:480px){.overlay{align-items:center;padding:20px}}
.modal{width:100%;max-width:420px;background:#fff;border-radius:20px 20px 0 0;padding:18px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:17px;font-weight:800;margin-bottom:4px}
.modal .sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.btn-ghost{flex:1;padding:12px;border-radius:12px;background:#f1f5f9;font-weight:700}
.btn-primary{flex:1;padding:12px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700}
.actions{display:flex;gap:10px;margin-top:10px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;background:#052e16;color:#bbf7d0;padding:11px 16px;border-radius:12px;font-weight:700;font-size:13px;max-width:90%}
.toast.err{background:#450a0a;color:#fecaca}
.userline{display:flex;align-items:center;gap:8px;background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:12px;padding:8px 10px;margin-bottom:12px;font-size:12px}
.userline img{width:26px;height:26px;border-radius:50%}
.pay-box{text-align:center}
.pay-box img{max-width:100%;border-radius:12px}
.khqr-card.full-image{max-width:300px;margin:0 auto 12px}
.khqr-card.full-image img{width:100%;display:block;border-radius:14px}
@media(min-width:720px){
  .sheet,.hero-img,.top{max-width:720px;margin-left:auto;margin-right:auto}
  .sticky-buy{max-width:720px;left:50%;transform:translateX(-50%);border-radius:16px 16px 0 0}
}

body{background:
  radial-gradient(900px 500px at 50% -20%, #dbeafe 0%, transparent 60%),
  var(--bg,#f1f5f9);
}
.now{background:linear-gradient(135deg,#dc2626,#ef4444);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn-buy{background:linear-gradient(135deg,#1d4ed8,#3b82f6);border:none}
.badge-hot{animation:pulseHot 2.4s ease-in-out infinite}
@keyframes pulseHot{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.sheet{animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.overlay{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal{animation:sheetUp .28s cubic-bezier(.22,1,.36,1)}
@keyframes sheetUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}


.pay-methods{display:grid;gap:10px;margin:12px 0}
.pay-method{
  display:flex;align-items:center;gap:12px;padding:14px;
  border:2px solid var(--line);border-radius:14px;background:#fff;
  text-align:left;transition:border-color .15s,box-shadow .15s;cursor:pointer;width:100%;
}
.pay-method:hover{border-color:var(--blue-line);background:var(--blue-soft)}
.pay-method.on{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.pay-method .pm-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:#f1f5f9;color:var(--blue)}
.pay-method.on .pm-ico{background:var(--blue);color:#fff}
.pay-method .pm-ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.pay-method .pm-t{flex:1;min-width:0}
.pay-method .pm-t b{display:block;font-size:14px;font-weight:800}
.pay-method .pm-t span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.pay-method .pm-amt{font-size:14px;font-weight:800;color:var(--blue)}
.pay-method.disabled{opacity:.5;pointer-events:none}
.pay-method.khqr .pm-ico{background:#fef2f2;color:#ed1c24}
.pay-method.khqr.on .pm-ico{background:#ed1c24;color:#fff}
.pay-secure{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--faint);margin-top:8px}
.pay-secure svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}


/* Pchum Ben theme */
:root{
  --blue:#b45309 !important;--blue2:#c2410c !important;--blue-soft:#fff7ed !important;--blue-line:#fed7aa !important;
  --bg:#faf6f1 !important;--saffron:#e87a1e;--gold:#c9a227;
}
body{background:radial-gradient(900px 450px at 50% -15%,#ffedd5 0%,transparent 55%),#faf6f1 !important}
.btn-buy,.btn-primary{background:linear-gradient(135deg,#9a3412,#ea580c)!important;box-shadow:0 6px 18px rgba(194,65,12,.28)!important}
.top{border-bottom-color:#fed7aa!important}


.hero-img{
  transform-style:preserve-3d;
  perspective:800px;
}
.hero-img img{
  transition:transform .5s cubic-bezier(.22,1,.36,1);
  filter:drop-shadow(0 20px 40px rgba(15,23,42,.18));
  animation:floatY 4s ease-in-out infinite;
}
@keyframes floatY{
  0%,100%{transform:translateY(0) rotateY(0)}
  50%{transform:translateY(-8px) rotateY(4deg)}
}
.hero-img:hover img{transform:scale(1.05) rotateY(-6deg);animation:none}
.rel-card{
  transform-style:preserve-3d;
  transition:transform .3s,box-shadow .3s;
}
.rel-card:hover{
  transform:translateY(-8px) rotateX(5deg) scale(1.03);
  box-shadow:0 14px 28px rgba(15,23,42,.12);
}
.sticky-buy .btn-buy{
  transition:transform .2s,box-shadow .2s;
}
.sticky-buy .btn-buy:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 12px 28px rgba(29,78,216,.4)}
.sheet{animation:sheet3d .45s cubic-bezier(.22,1,.36,1)}
@keyframes sheet3d{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}
@media (prefers-reduced-motion:reduce){
  .hero-img img,.rel-card,.sheet{animation:none!important;transition:none!important}
}


/* ── 3D product detail ── */
.hero-img{
  perspective:1000px;
  transform-style:preserve-3d;
}
.hero-img img{
  transition:transform .5s cubic-bezier(.22,1,.36,1);
  transform-style:preserve-3d;
}
.hero-img:hover img{
  transform:scale(1.06) rotateY(-8deg) rotateX(4deg) translateZ(20px);
}
.sheet{
  animation:sheet3d .4s cubic-bezier(.22,1,.36,1);
}
@keyframes sheet3d{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}
.rel-card{
  transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s;
  transform-style:preserve-3d;
}
.rel-card:hover{
  transform:translateY(-8px) rotateY(-5deg) scale(1.03);
  box-shadow:0 14px 28px rgba(15,23,42,.12);
}
.sticky-buy .btn-buy{
  transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s;
}
.sticky-buy .btn-buy:hover:not(:disabled){
  transform:translateY(-3px) scale(1.03);
  box-shadow:0 12px 28px rgba(29,78,216,.4);
}
.back,.icon-btn{
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.back:hover,.icon-btn:hover{transform:scale(1.1)}
.back:active,.icon-btn:active{transform:scale(.9)}
.modal{animation:modal3d .35s cubic-bezier(.22,1,.36,1)}
@keyframes modal3d{
  from{opacity:0;transform:translateY(40px) scale(.94)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@media (prefers-reduced-motion:reduce){
  .sheet,.hero-img img{animation:none;transition:none}
}


/* ── modal + scroll animations ── */
.overlay{
  animation:ovIn .28s ease both;
}
@keyframes ovIn{
  from{opacity:0}
  to{opacity:1}
}
.overlay.closing{animation:ovOut .22s ease both}
@keyframes ovOut{
  from{opacity:1}
  to{opacity:0}
}
.modal{
  animation:modalIn .38s cubic-bezier(.22,1,.36,1) both !important;
}
.overlay.closing .modal{animation:modalOut .22s ease both !important}
@keyframes modalIn{
  from{opacity:0;transform:translateY(48px) scale(.94)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes modalOut{
  from{opacity:1;transform:translateY(0) scale(1)}
  to{opacity:0;transform:translateY(28px) scale(.96)}
}
@media(min-width:480px){
  @keyframes modalIn{
    from{opacity:0;transform:translateY(24px) scale(.92) rotateX(6deg)}
    to{opacity:1;transform:translateY(0) scale(1) rotateX(0)}
  }
}

/* scroll reveal */
.reveal{
  opacity:0;
  transform:translateY(28px);
  transition:opacity .55s cubic-bezier(.22,1,.36,1),transform .55s cubic-bezier(.22,1,.36,1);
  will-change:opacity,transform;
}
.reveal.in{
  opacity:1;
  transform:translateY(0);
}
.reveal-left{transform:translateX(-24px)}
.reveal-left.in{transform:translateX(0)}
.reveal-scale{transform:scale(.92)}
.reveal-scale.in{transform:scale(1)}
.section.reveal .section-head{transition-delay:.05s}
.pcard.reveal{transition-delay:calc(var(--i,0) * 50ms)}
.flash-card.reveal{transition-delay:calc(var(--i,0) * 40ms)}

@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
  .overlay,.modal{animation:none!important}
}

</style>
{% include '_fonts.html' %}
</head>
<body>
<header class="top">
  <button class="back" type="button" onclick="history.length>1?history.back():location.href='/'" aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="title" id="topTitle">Product</div>
  <button class="icon-btn" type="button" onclick="location.href='/profile'" aria-label="Wallet">
    <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M16 14h2"/></svg>
  </button>
</header>

<div id="main"><div style="padding:40px;text-align:center;color:var(--muted)">Loading...</div></div>

<div class="sticky-buy" id="sticky" style="display:none">
  <div class="sp">
    <div class="l">តម្លៃ</div>
    <div class="v" id="stPrice">$0.00</div>
  </div>
  <button class="btn-buy" type="button" id="btnBuy" onclick="doBuy()">
    <svg viewBox="0 0 24 24"><path d="M6 8h12l1 12H5L6 8z"/><path d="M9 8V7a3 3 0 016 0v1"/></svg>
    Buy Now
  </button>
</div>

<div class="toast hidden" id="toast"></div>

<script>
const PID = {{ product_id|int }};
const GCID = {{ site.google_client_id|tojson }};
const $ = s => document.querySelector(s);
let P = null, USER = null, POLL = null, CATALOG = null;
let GSI_READY = false, GSI_LOADING = null;

const CAT_LABEL = {
  streaming:'Movie / TV / Show', creative:'Designing / Video Editing',
  music:'Music / Audio', ai:'AI / ChatBot', other:'Other'
};

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return '$'+Number(n||0).toFixed(2)}
function toast(m,e){const t=$('#toast');t.textContent=m;t.classList.toggle('err',!!e);t.classList.remove('hidden');clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.add('hidden'),2800)}
async function api(path,opt={}){
  const r=await fetch('/api/'+path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});
  return r.json().catch(()=>({ok:false}));
}
function oldPrice(p){const x=Number(p.old_price||p.compare_at||0);return x>Number(p.price)?x:0}
function offPct(p){const o=oldPrice(p);if(!o)return 0;return Math.round((1-Number(p.price)/o)*100)}

function productImg(p, big){
  const src=(p.image||'').trim();
  const letter=esc((p.name||'?').slice(0,2).toUpperCase());
  if(!src) return `<div class="ph">${letter}</div>`;
  // Always full image for digital product icons (Wink, CapCut, Netflix…)
  return `<img src="${esc(src)}" alt="${esc(p.name||'')}" class="logo" onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('beforeend','<div class=ph>${letter}</div>')">`;
}


function render(){
  if(!P){
    $('#main').innerHTML=`<div style="padding:48px 20px;text-align:center"><p style="color:var(--muted);margin-bottom:16px">រកមិនឃើញផលិតផល</p><a class="btn-buy" href="/" style="display:inline-flex;width:auto;padding:12px 24px">ត្រលប់ហាង</a></div>`;
    return;
  }
  const stock=Number(P.stock||0);
  const o=oldPrice(P), off=offPct(P);
  const cat=CAT_LABEL[P.cat]||P.cat||'Digital';
  document.title=P.name+' · Kairozen Store';
  $('#topTitle').textContent=P.name;
  $('#stPrice').textContent=money(P.price);
  const btn=$('#btnBuy');
  if(btn){ btn.disabled=stock<=0; btn.innerHTML=stock>0
    ? `<svg viewBox="0 0 24 24"><path d="M6 8h12l1 12H5L6 8z"/><path d="M9 8V7a3 3 0 016 0v1"/></svg> Buy Now`
    : `Sold Out`; }
  $('#sticky').style.display='flex';

  const rel=(CATALOG.products||[]).filter(x=>x.id!==P.id && x.cat===P.cat && Number(x.stock||0)>0).slice(0,8);
  const rel2=rel.length?rel:(CATALOG.products||[]).filter(x=>x.id!==P.id).slice(0,8);

  $('#main').innerHTML=`
  <div class="hero-img">
    ${P.badge?`<span class="badge-hot">${esc(P.badge)}</span>`:''}
    ${off?`<span class="badge-off">-${off}%</span>`:''}
    ${productImg(P,true)}
  </div>
  <div class="sheet">
    <div class="cat">${esc(cat)}</div>
    <h1>${esc(P.name)}</h1>
    <div class="rating"><span class="stars">★★★★★</span> <span>4.9 · Digital product</span></div>
    <div class="prices">
      <span class="now">${money(P.price)}</span>
      ${o?`<span class="was">${money(o)}</span>`:''}
      ${off?`<span class="offchip">-${off}%</span>`:''}
    </div>
    <div class="meta">
      ${stock>0?`<span class="ok">In Stock · ${stock}</span><span class="blue">Instant delivery</span>`:`<span class="bad">Sold Out</span>`}
      ${P.duration?`<span class="blue">${esc(P.duration)}</span>`:''}
    </div>
    <div class="block">
      <h3>Description</h3>
      <div class="desc">${esc(P.desc||'Premium digital account · Auto delivery after payment.')}</div>
      <p class="note">បន្ទាប់ពីបង់លុយ — account នឹងបង្ហាញភ្លាមក្នុង Profile / Order history។ សូមអាន description មុនទិញ។</p>
    </div>
    <div class="block">
      <h3>How to buy</h3>
      <div class="desc">1. ចូលគណនី Google\n2. ចុច Buy Now · បង់ KHQR / Wallet\n3. ទទួល account ស្វ័យប្រវត្តិ</div>
    </div>
    ${rel2.length?`<div class="rel"><h3>Related products</h3><div class="rel-row">${rel2.map(r=>`
      <a class="rel-card" href="/product/${r.id}">
        <div class="ri">${productImg(r)}</div>
        <div class="rb"><div class="rn">${esc(r.name)}</div><div class="rp">${money(r.price)}</div></div>
      </a>`).join('')}</div></div>`:''}
  </div>`;
}

async function load(){
  const r=await api('catalog');
  CATALOG=r;
  P=(r.products||[]).find(x=>Number(x.id)===Number(PID))||null;
  const me=await api('auth/me');
  USER=me.user||null;
  render();
}

function closeModal(){
  if(POLL){clearInterval(POLL);POLL=null}
  const ov=document.querySelector('.overlay');
  if(!ov)return;
  ov.classList.add('closing');
  setTimeout(()=>ov.remove(),220);
}
function gIcon(){return `<svg viewBox="0 0 24 24" width="16" height="16"><path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>`}

function loadGSI(){
  if(window.google?.accounts?.id) return Promise.resolve();
  if(GSI_LOADING) return GSI_LOADING;
  GSI_LOADING=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>res();s.onerror=()=>rej();document.head.appendChild(s)});
  return GSI_LOADING;
}
async function onGoogleCred(resp){
  const r=await api('auth/google',{method:'POST',body:JSON.stringify({credential:resp.credential})});
  if(!r.ok){toast(r.error||'Login failed',true);return}
  USER=r.user; closeModal(); toast('សូមស្វាគមន៍'); doBuy();
}
async function openLogin(){
  closeModal();
  const ov=document.createElement('div');ov.className='overlay';ov.onclick=e=>{if(e.target===ov)closeModal()};
  ov.innerHTML=`<div class="modal" style="text-align:center"><h3>ចូលគណនី</h3><div class="sub">ត្រូវ login Google មុនទិញ</div><div id="gbox" style="min-height:44px"></div><div class="actions"><button class="btn-ghost" type="button" onclick="closeModal()">បិទ</button></div></div>`;
  document.body.appendChild(ov);
  if(!GCID){ $('#gbox').innerHTML='<span style="color:var(--red);font-size:12px">Google មិនទាន់បើក</span>'; return; }
  try{
    await loadGSI();
    if(!GSI_READY){google.accounts.id.initialize({client_id:GCID,callback:onGoogleCred,ux_mode:'popup'});GSI_READY=true}
    const box=$('#gbox');box.innerHTML='';
    google.accounts.id.renderButton(box,{theme:'outline',size:'large',shape:'pill',text:'continue_with',width:280});
  }catch(e){$('#gbox').innerHTML='Google load fail'}
}

function mergePay(r){return Object.assign({},r.payment||{},r.khmer_system||{})}
function abaOpenHref(pay){
  if(!pay)return '';
  const dl=(pay.ABA_DEEPLINK||pay.abapay_deeplink||'').trim();
  const qs=(pay.QR_STRING||pay.qr_string||'').trim();
  const url=(pay.PAYMENT_URL||pay.payment_url||'').trim();
  if(dl)return '/open-aba?dl='+encodeURIComponent(dl);
  if(qs)return '/open-aba?qr='+encodeURIComponent(qs);
  if(url)return url; return '';
}

async function doBuy(){
  if(!P||Number(P.stock||0)<=0){toast('Sold out',true);return}
  if(!USER){openLogin();return}
  const bal=Number(USER.balance||0);
  const price=Number(P.price||0);
  const canBal=bal>=price;
  window.__payMethod=canBal?'balance':'khqr';
  const ov=document.createElement('div');ov.className='overlay';ov.onclick=e=>{if(e.target===ov)closeModal()};
  ov.innerHTML=`<div class="modal">
    <h3>${esc(P.name)}</h3>
    <div class="sub">${money(price)} · ${esc(P.duration||'')}</div>
    <div class="userline"><img src="${esc(USER.picture||'')}" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'"><span>${esc(USER.email)}</span></div>
    <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px">ជ្រើសវិធីទូទាត់</div>
    <div class="pay-methods">
      <button type="button" class="pay-method ${canBal?'on':''} ${canBal?'':'disabled'}" id="pmBal" onclick="selectPay('balance')">
        <div class="pm-ico"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M16 14h2"/></svg></div>
        <div class="pm-t"><b>Wallet Balance</b><span>Balance ${money(bal)}${canBal?'':' · មិនគ្រប់'}</span></div>
        <div class="pm-amt">${money(price)}</div>
      </button>
      <button type="button" class="pay-method khqr ${canBal?'':'on'}" id="pmKhqr" onclick="selectPay('khqr')">
        <div class="pm-ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v6h-6"/></svg></div>
        <div class="pm-t"><b>KHQR · ABA</b><span>ស្កេន QR · Auto confirm</span></div>
        <div class="pm-amt">${money(price)}</div>
      </button>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px"><a href="/profile">Top up wallet</a></div>
    <div id="buyBody"></div>
    <div class="actions" id="buyActions">
      <button class="btn-ghost" type="button" onclick="closeModal()">បិទ</button>
      <button class="btn-primary" type="button" id="btnCreate" onclick="createOrder(window.__payMethod==='balance')">បន្តបង់</button>
    </div>
    <div class="pay-secure"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg> Secure · Auto delivery</div>
  </div>`;
  document.body.appendChild(ov);
}
function selectPay(m){
  window.__payMethod=m;
  document.getElementById('pmBal')?.classList.toggle('on', m==='balance');
  document.getElementById('pmKhqr')?.classList.toggle('on', m==='khqr');
}
async function createOrder(withBalance){
  const btn=$('#btnCreate'); if(btn){btn.disabled=true;btn.textContent='Processing...'}
  const r=await api('order',{method:'POST',body:JSON.stringify({product_id:P.id,pay_with_balance:!!withBalance})});
  const box=$('#buyBody');
  if(!r.ok){
    if(r.login_required){closeModal();openLogin();return}
    toast(r.error||'Failed',true);
    if(btn){btn.disabled=false;btn.textContent='Pay KHQR'}
    return;
  }
  if(r.paid_with==='balance'){
    if(typeof r.balance==='number') USER.balance=r.balance;
    if(btn) btn.style.display='none';
    box.innerHTML=`<div style="text-align:center;color:var(--green);font-weight:800">Payment success</div>
      ${r.order?.delivery?`<div style="margin-top:12px;background:var(--green-bg);padding:12px;border-radius:12px;font-family:ui-monospace;font-size:12px;word-break:break-all">${esc(r.order.delivery)}</div>`:''}
      <p style="margin-top:10px;font-size:12px;color:var(--muted)"><a href="/profile">មើលក្នុង Profile</a></p>`;
    toast('Success'); load(); return;
  }
  const o=r.order, pay=mergePay(r), qr=pay.PAYMENT_QR||'';
  if(btn) btn.style.display='none';
  const aba=abaOpenHref(pay);
  box.innerHTML=`<div class="pay-box">
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">ស្កេន KHQR ដើម្បីបង់</div>
    <div class="prices" style="justify-content:center"><span class="now">${money(o.price)}</span></div>
    ${qr?`<div class="khqr-card full-image"><img src="${esc(qr)}" alt="KHQR"></div>`:`<div style="color:var(--red)">${esc(r.ks_error||'No QR')}</div>`}
    <div style="font-size:11px;color:var(--faint)">Order ${esc(o.id)}</div>
    <div id="paySt" style="font-size:12px;color:var(--muted);margin:8px 0">Waiting for payment...</div>
    ${aba?`<a class="btn-buy" href="${aba}" target="_blank" rel="noopener" style="background:#ed1c24;margin-top:8px">បើក ABA Mobile</a>`:''}
  </div>`;
  if(qr) startPoll(o.id);
}
function startPoll(oid){
  if(POLL) clearInterval(POLL);
  let n=0;
  POLL=setInterval(async()=>{
    n++; if(n>90){clearInterval(POLL);return}
    const r=await api('order/check-payment',{method:'POST',body:JSON.stringify({order_id:oid})});
    const st=$('#paySt'); if(st) st.textContent='Status: '+(r.payment_status||'...');
    if(r.payment_status==='completed'||r.order?.status==='paid'){
      clearInterval(POLL);
      const box=$('#buyBody');
      if(box) box.innerHTML=`<div style="text-align:center;color:var(--green);font-weight:800">Payment success</div>
        ${r.order?.delivery?`<div style="margin-top:12px;background:var(--green-bg);padding:12px;border-radius:12px;font-family:ui-monospace;font-size:12px;word-break:break-all">${esc(r.order.delivery)}</div>`:''}
        <p style="margin-top:10px;font-size:12px"><a href="/profile">មើលក្នុង Profile</a></p>`;
      load();
    }
  },4000);
}

load();

function startHeartbeat(){
  const ping=()=>{ fetch('/api/auth/heartbeat',{method:'POST',credentials:'same-origin'}).catch(()=>{}); };
  ping();
  if(window.__hb) clearInterval(window.__hb);
  window.__hb=setInterval(ping, 60000);
}
startHeartbeat();

</script>
</body>
</html>
