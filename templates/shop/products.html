<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All Products · {{ site.name }}</title>
<meta name="theme-color" content="#1d4ed8">
<link rel="icon" href="{{ site.logo }}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1d4ed8;--blue2:#2563eb;--bg:#f1f5f9;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--card:#fff;--red:#ef4444;--font:'Inter','Kantumruy Pro',system-ui,sans-serif;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 14px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--blue);text-decoration:none}
.brand img{width:34px;height:34px;border-radius:10px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;padding:7px 11px;border-radius:999px}
.nav a:hover,.nav a.on{background:#eff6ff;color:var(--blue)}
.wrap{max-width:960px;margin:0 auto;padding:18px 14px 90px}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.lead{color:var(--muted);font-size:13px;margin-bottom:16px}
.auth-card{max-width:400px;margin:24px auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center;box-shadow:0 12px 40px rgba(15,23,42,.08)}
.auth-card img.logo{width:56px;height:56px;border-radius:14px;margin-bottom:12px}
.auth-card h1{font-size:20px;color:var(--blue)}
.auth-card .lead{margin-bottom:20px}
.btn-ggl{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;cursor:pointer;color:var(--text)}
.btn-ggl:hover{border-color:var(--blue);background:#eff6ff}
.btn-ggl svg{width:18px;height:18px}
.hint{font-size:12px;color:var(--muted);margin-top:14px}
.hint a{color:var(--blue2);font-weight:700;text-decoration:none}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:12px;color:var(--muted);cursor:pointer}
.cats button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.pcard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(15,23,42,.05);cursor:pointer;transition:transform .2s,box-shadow .2s}
.pcard:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(15,23,42,.1)}
.pcard .thumb{aspect-ratio:1;background:linear-gradient(145deg,#fff,#f1f5f9);display:grid;place-items:center}
.pcard .thumb img{width:100%;height:100%;object-fit:contain;padding:12%}
.pcard .body{padding:10px 12px 12px}
.pcard .cat{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase}
.pcard h3{font-size:13px;font-weight:800;margin:4px 0 6px;line-height:1.3}
.pcard .price{font-size:15px;font-weight:800;color:var(--red)}
.pcard .was{font-size:11px;color:#94a3b8;text-decoration:line-through;margin-left:4px}
.empty{grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)}
.foot{text-align:center;padding:16px;font-size:11px;color:#94a3b8}
.foot a{color:var(--blue2);font-weight:600;text-decoration:none;margin:0 3px}
.search{position:relative;margin-bottom:14px}
.search input{width:100%;padding:12px 14px 12px 40px;border-radius:12px;border:1px solid var(--line);font:inherit;outline:none}
.search input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94a3b8}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><img src="{{ site.logo }}" alt="">{{ site.name }}</a>
  <nav class="nav">
    <a href="/">ហាង</a>
    <a href="/products" class="on">Products</a>
    <a href="/how-to-buy">របៀបទិញ</a>
    <a href="/contact">Contact</a>
    <a href="/login">Login</a>
  </nav>
</header>

<div class="wrap">
  <h1>All Products</h1>
  <p class="lead">ផលិតផលទាំងអស់ · ដូច Shiryu Premium catalog</p>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" type="search" placeholder="ស្វែងរកផលិតផល..." oninput="render()">
  </div>
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"><div class="empty">កំពុងផ្ទុក...</div></div>
</div>
<script>
const $=s=>document.querySelector(s);
let CATALOG={products:[],categories:[]}, CAT='all';
const money=n=>'$'+Number(n||0).toFixed(2);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function filtered(){
  let list=CATALOG.products||[];
  if(CAT!=='all') list=list.filter(p=>(p.cat||'')===CAT);
  const q=($('#q').value||'').trim().toLowerCase();
  if(q) list=list.filter(p=>((p.name||'')+' '+(p.desc||'')+' '+(p.cat||'')).toLowerCase().includes(q));
  return list;
}
function render(){
  const list=filtered();
  const labels={};
  (CATALOG.categories||[]).forEach(c=>labels[c.slug]=c.name);
  $('#cats').innerHTML=['all',...new Set((CATALOG.products||[]).map(p=>p.cat).filter(Boolean))].map(c=>{
    const name=c==='all'?'ទាំងអស់':(labels[c]||c);
    return `<button type="button" class="${CAT===c?'on':''}" onclick="CAT='${esc(c)}';render()">${esc(name)}</button>`;
  }).join('');
  $('#grid').innerHTML=list.length?list.map(p=>{
    const img=(p.image||'').trim();
    const o=p.old_price||p.compare_at;
    return `<article class="pcard" onclick="location.href='/product/${p.id}'">
      <div class="thumb">${img?`<img src="${esc(img)}" alt="" loading="lazy">`:`<span style="font-weight:800;color:#bfdbfe">${esc((p.name||'?').slice(0,2))}</span>`}</div>
      <div class="body">
        <div class="cat">${esc(labels[p.cat]||p.cat||'Digital')}</div>
        <h3>${esc(p.name)}</h3>
        <div><span class="price">${money(p.price)}</span>${o?`<span class="was">${money(o)}</span>`:''}</div>
      </div>
    </article>`;
  }).join(''):'<div class="empty">មិនមានផលិតផល</div>';
}
fetch('/api/catalog').then(r=>r.json()).then(d=>{CATALOG=d;render()}).catch(()=>{$('#grid').innerHTML='<div class="empty">បរាជ័យផ្ទុក</div>'});
</script>

<footer class="foot">
  <a href="/products">Products</a>·<a href="/how-to-buy">របៀបទិញ</a>·<a href="/contact">Contact</a>·<a href="/login">Login</a>·<a href="/register">Register</a>·<a href="/faq">FAQ</a>
</footer>
</body>
</html>
